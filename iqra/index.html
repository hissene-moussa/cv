<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestion des bulletins scolaires</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Gestion des bulletins scolaires</h1>
  <p>Saisissez le relevé de notes : totaux, moyennes, rang et décision sont calculés automatiquement. Un bulletin PDF bilingue est généré pour chaque élève.</p>
</header>
<main>

<section class="card">
  <h2>Paramètres</h2>
  <div class="grid" id="sg"></div>
</section>

<section class="card">
  <div class="bar">
    <h2 style="margin:0">Relevé de notes</h2>
    <span class="sp"></span>
    <button class="sec" id="bAdd">+ Ajouter une élève</button>
    <button class="ac" id="bCsvFile">📂 Importer CSV</button>
    <button class="sec" id="bCsv">Exporter CSV</button>
    <button class="ac" id="bAll">Tous les bulletins (PDF)</button>
    <button class="delAll" id="bDelAll">🗑 Tout supprimer</button>
  </div>
  <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
  <div class="wrap" style="margin-top:10px">
    <table class="t"><thead id="th"></thead><tbody id="tb"></tbody></table>
  </div>
  <div id="msg"></div>
  <div class="stats" id="stats" style="margin-top:6px"></div>
</section>

<!-- Aperçu du bulletin affiché EN BAS de la page principale -->
<section class="card" id="pc" hidden>
  <div class="bar">
    <h2 style="margin:0">Aperçu du bulletin</h2>
    <span class="sp"></span>
    <button class="sec" id="pPdf">Télécharger ce PDF</button>
    <button class="sec" id="pX">Fermer</button>
  </div>
  <div id="pw" style="margin-top:10px"><div id="ps"></div></div>
</section>

</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="script.js"></script>
</body>
</html>
